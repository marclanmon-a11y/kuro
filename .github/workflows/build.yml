name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip kuro-26.2-source.zip
      - run: sed -i 's/mc\.screen == null/mc.gui.screen() == null/; s/mc\.setScreen(/mc.gui.setScreen(/' kuro-client-26.2/src/main/java/dev/kuro/KuroClient.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
        working-directory: kuro-client-26.2
      - uses: actions/upload-artifact@v4
        with:
          name: kuro-jar
          path: kuro-client-26.2/build/libs/kuro-*.jar
